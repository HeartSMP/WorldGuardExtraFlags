name: Release jar

# Every push to master builds the plugin and publishes the jar as a rolling pre-release
# ("latest-master") in the Releases tab.
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Publish rolling pre-release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest-master --cleanup-tag --yes || true
        gh release create latest-master Spigot/target/WorldGuardExtraFlags.jar \
          --target "$GITHUB_SHA" \
          --title "WorldGuardExtraFlags build ${{ github.run_number }}" \
          --notes "Automatic build of commit $GITHUB_SHA." \
          --prerelease
